<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }
  body { width: 400px; min-height: 870px; background: radial-gradient(ellipse at top, #0d2818 0%, #050505 60%); color: #fff; position: relative; overflow: hidden; }

  .stars { position: absolute; inset: 0; background-image:
    radial-gradient(1px 1px at 20px 40px, rgba(255,255,255,0.6), transparent),
    radial-gradient(1px 1px at 80px 110px, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 150px 60px, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 220px 90px, rgba(255,255,255,0.3), transparent),
    radial-gradient(1px 1px at 290px 40px, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 340px 140px, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 60px 180px, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 180px 220px, rgba(255,255,255,0.3), transparent);
    pointer-events: none;
  }

  .statusbar { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px 8px; font-size: 15px; color: #fff; font-weight: 700; }
  .statusbar .sb-right { display: flex; align-items: center; gap: 6px; }
  .sb-net { font-size: 12px; font-weight: 700; letter-spacing: 0.3px; }
  .topbar { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 10px 18px; }
  .topbar .x { font-size: 22px; color: #fff; }
  .topbar .icons { display: flex; gap: 14px; }
  .icons .cc { width: 30px; height: 30px; border-radius: 50%; border: 1px solid #333; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; }

  .content { position: relative; padding: 24px 24px 0; text-align: center; }
  .amt { font-size: 44px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .amt .rupee { font-size: 26px; vertical-align: top; margin-top: 8px; display: inline-block; color: #f9a825; }
  .from { font-size: 18px; font-weight: 700; color: #fff; margin-top: 4px; }
  .via { font-size: 13px; color: #bdbdbd; margin-top: 4px; }

  .triangle-wrap { margin: 28px auto 10px; width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(180deg, #123826 0%, #050505 100%); display: flex; align-items: center; justify-content: center; position: relative; border: 1px solid rgba(255,255,255,0.08); }
  .triangle-wrap svg { width: 36px; height: 36px; }
  .received { color: #22c55e; font-size: 16px; font-weight: 700; margin-top: 12px; }
  .dateline { font-size: 13px; color: #bdbdbd; margin-top: 22px; }
  .txn { font-size: 13px; color: #bdbdbd; margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .txn .copy { font-size: 14px; color: #bdbdbd; }
  .view-details { color: #f9a825; font-size: 15px; font-weight: 700; margin-top: 18px; }

  .help-card { position: relative; margin: 26px 20px 0; background: #141414; border-radius: 16px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; border: 1px solid #1f1f1f; }
  .help-card .q { width: 34px; height: 34px; border-radius: 50%; background: #1f1f1f; color: #bdbdbd; display: flex; align-items: center; justify-content: center; font-size: 14px; border: 1px solid #333; }
  .help-card .l { flex: 1; font-size: 15px; color: #fff; font-weight: 600; }
  .help-card .ch { color: #bdbdbd; font-size: 18px; }

  .fam-footer { position: relative; text-align: center; margin-top: 40px; padding-bottom: 24px; color: #555; font-size: 11px; font-weight: 700; letter-spacing: 2px; }
  .fam-text { display: inline-block; background: #0a0a0a; color: #f9a825; padding: 6px 14px; border-radius: 16px; font-size: 13px; font-weight: 800; letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="statusbar">
    <div>{{statusBarTime}}</div>
    <div class="sb-right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="0.5"/><rect x="5" y="5" width="3" height="7" rx="0.5"/><rect x="10" y="2" width="3" height="10" rx="0.5"/><rect x="15" y="0" width="3" height="12" rx="0.5"/></svg>
      <span class="sb-net">5G</span>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="1" y="1" width="19" height="10" rx="2.5" stroke="currentColor" stroke-width="1.4"/><rect x="20.5" y="4" width="1.8" height="4" rx="0.5" fill="currentColor"/><rect x="3" y="3" width="13" height="6" rx="1" fill="currentColor"/></svg>
    </div>
  </div>
  <div class="topbar">
    <div class="x">✕</div>
    <div class="icons">
      <div class="cc"><svg viewBox="0 0 24 24" width="14" height="14" fill="none"><circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="2"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 1-1 1.7v.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="0.8" fill="#fff"/></svg></div>
      <div class="cc"><svg viewBox="0 0 24 24" width="14" height="14" fill="none"><circle cx="18" cy="6" r="2.5" stroke="#fff" stroke-width="2"/><circle cx="6" cy="12" r="2.5" stroke="#fff" stroke-width="2"/><circle cx="18" cy="18" r="2.5" stroke="#fff" stroke-width="2"/><path d="M8.5 10.5l7-3M8.5 13.5l7 3" stroke="#fff" stroke-width="2"/></svg></div>
    </div>
  </div>

  <div class="content">
    <div class="amt"><span class="rupee">₹</span>{{amountFormatted}}</div>
    <div class="from">from {{senderName}}</div>
    <div class="via">Sent using Paytm UPI</div>

    <div class="triangle-wrap">
      <svg viewBox="0 0 36 36" fill="none">
        <path d="M18 4 L32 28 H4 Z" fill="#f9a825"/>
        <path d="M18 10 L28 26 H8 Z" fill="#22c55e"/>
      </svg>
    </div>
    <div class="received">● Received</div>

    <div class="dateline">{{date}} at {{time12}}</div>
    <div class="txn">TXN ID: {{refId}} <svg viewBox="0 0 24 24" width="14" height="14" fill="none"><rect x="8" y="8" width="12" height="12" rx="2" stroke="#bdbdbd" stroke-width="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="#bdbdbd" stroke-width="2" stroke-linecap="round"/></svg></div>

    <div class="view-details">View Details</div>
  </div>

  <div class="help-card">
    <div class="q"><svg viewBox="0 0 24 24" width="14" height="14" fill="none"><circle cx="12" cy="12" r="9" stroke="#bdbdbd" stroke-width="2"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 1-1 1.7v.5" stroke="#bdbdbd" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="0.8" fill="#bdbdbd"/></svg></div>
    <div class="l">Get Help</div>
    <div class="ch">›</div>
  </div>

  <div class="fam-footer">
    <div class="fam-text">FamPay</div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }
  body { width: 400px; min-height: 870px; background: #fff; color: #0f172a; }

  .brand { padding: 40px 0 24px; text-align: center; }
  .brand .logo { font-size: 42px; font-weight: 900; letter-spacing: -1px; }
  .brand .logo .p { color: #002e6e; }
  .brand .logo .a { color: #002e6e; }
  .brand .logo .y { color: #002e6e; }
  .brand .logo .t { color: #00BAF2; }
  .brand .logo .m { color: #00BAF2; }

  .top-card { margin: 0 20px; background: #e9f6ff; border-radius: 24px 24px 0 0; padding: 36px 24px 40px; text-align: center; position: relative; }
  .top-card .title { font-size: 22px; font-weight: 800; color: #0f172a; }
  .top-card .amt-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 18px 0 10px; }
  .top-card .amt { font-size: 46px; font-weight: 800; color: #0f172a; letter-spacing: -1px; }
  .top-card .rup { font-size: 40px; font-weight: 800; color: #0f172a; }
  .top-card .check { width: 38px; height: 38px; position: relative; display: flex; align-items: center; justify-content: center; }
  .top-card .check svg { width: 100%; height: 100%; }
  .top-card .words { font-size: 14px; color: #64748b; }
  .top-card .upi-pill { display: inline-flex; align-items: center; gap: 8px; background: #fff; padding: 10px 22px; border-radius: 24px; margin-top: 18px; font-size: 14px; font-weight: 600; color: #0f172a; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
  .top-card .upi-pill .ico { font-size: 14px; }

  .blue-bar { height: 10px; background: #00BAF2; margin: 0 20px; }

  .receipt { margin: 0 20px; background: #fff; border: 1px dashed #e2e8f0; border-top: none; border-radius: 0 0 8px 8px; padding: 26px 22px 30px; position: relative; }
  .receipt::before, .receipt::after { content: ''; position: absolute; top: 0; width: 14px; height: 14px; background: #fff; border-radius: 50%; }
  .receipt::before { left: -7px; }
  .receipt::after { right: -7px; }

  .party { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 8px 0; }
  .party .text .lbl { font-size: 18px; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
  .party .text .sub { font-size: 12px; color: #64748b; }
  .party .av { width: 40px; height: 40px; border-radius: 50%; background: #eef2ff; color: #4338ca; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .party .av.dark { background: #0f172a; color: #fff; font-size: 10px; }

  .dashsep { border-top: 2px dashed #cbd5e1; margin: 14px 0; }

  .footline { font-size: 13px; color: #64748b; margin-top: 5px; }
  .footline strong { color: #0f172a; font-weight: 700; }

  .zigzag { height: 18px; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 18'><path fill='%23fff' d='M0 0h20L10 18z'/></svg>") repeat-x; background-size: 20px 18px; margin: 0 20px; }

  .pfooter { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 20px 0 18px; font-size: 11px; color: #64748b; font-weight: 600; }
  .pfooter .divbar { color: #cbd5e1; }
  .upi-logo { display: inline-block; font-weight: 900; font-size: 13px; background: linear-gradient(90deg, #ff6b1a 0%, #00a859 50%, #0066ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.5px; }
</style>
</head>
<body>
  <div class="brand">
    <div class="logo"><span class="p">P</span><span class="a">a</span><span class="y">y</span><span class="t">t</span><span class="m">m</span></div>
  </div>

  <div class="top-card">
    <div class="title">Money Received</div>
    <div class="amt-row">
      <div class="rup">₹</div>
      <div class="amt">{{amountFormatted}}</div>
      <div class="check">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="18" fill="#22c55e"/>
          <path d="M12 20.5L17.5 26L28 15" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
    <div class="words">{{amountWords}}</div>
    <div class="upi-pill">
      <svg viewBox="0 0 20 20" width="14" height="14" fill="none"><circle cx="10" cy="10" r="8" stroke="#0f172a" stroke-width="1.6"/><circle cx="7.5" cy="9" r="0.9" fill="#0f172a"/><circle cx="12.5" cy="9" r="0.9" fill="#0f172a"/><path d="M6.5 12.5c1 1 2.2 1.5 3.5 1.5s2.5-.5 3.5-1.5" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"/></svg>
      UPI
    </div>
  </div>
  <div class="blue-bar"></div>

  <div class="receipt">
    <div class="party">
      <div class="text"><div class="lbl">From: {{senderName}}</div><div class="sub">UPI ID: {{senderUpiId}}</div></div>
      <div class="av">{{senderInitials}}</div>
    </div>
    <div class="dashsep"></div>
    <div class="party">
      <div class="text"><div class="lbl">To: Mr {{name}}</div></div>
      <div class="av dark">{{nameInitials}}</div>
    </div>

    <div class="footline">UPI Ref No: {{utr}}</div>
    <div class="footline">{{time12}}, {{date}}</div>
  </div>

  <div class="zigzag"></div>

  <div class="pfooter">
    <span style="font-weight: 800; color: #002e6e;">Paytm</span>
    <span class="divbar">|</span>
    <span>Powered by <span class="upi-logo">UPI</span></span>
    <span class="divbar">|</span>
    <span style="color: #0070c0;">✓ YES BANK</span>
  </div> -->
</body>
</html>

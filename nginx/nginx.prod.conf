worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # ACME HTTP-01 challenge (if using webroot-based Let's Encrypt)
    # map { default upstream } - upstream shortcut used below
    upstream backend_up  { server backend:5000; }
    upstream frontend_up { server frontend:80; }

    # Redirect all HTTP to HTTPS (comment out the two redirect blocks below
    # if you are not yet terminating SSL in this nginx — e.g. Cloudflare proxied).
    # server {
    #     listen 80 default_server;
    #     server_name _;
    #     location /.well-known/acme-challenge/ { root /var/www/certbot; }
    #     location / { return 301 https://$host$request_uri; }
    # }

    # Published landing pages over HTTP: any *.APP_DOMAIN (except www/api/admin)
    # is proxied to the backend, which matches Host header to a website row.
    server {
        listen 80;
        server_name ~^(?<site_sub>(?!www$|api$|admin$)[a-z0-9-]+)\.(?<site_root>.+)$;

        location / {
            proxy_pass http://backend_up;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS variant of the wildcard vhost.
    # Requires a wildcard cert at /etc/letsencrypt/live/<domain>/fullchain.pem
    # Obtain via: certbot certonly --manual --preferred-challenges dns -d "*.yourdomain.com" -d yourdomain.com
    # (or use the certbot DNS plugin for your provider for auto-renewal).
    # Uncomment the block below once certs are in place and volumes are mounted.
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name ~^(?<site_sub>(?!www$|api$|admin$)[a-z0-9-]+)\.(?<site_root>.+)$;
    #
    #     ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers on;
    #
    #     location / {
    #         proxy_pass http://backend_up;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    # }

    # Main application server
    server {
        listen 80 default_server;
        server_name localhost;

        # Frontend
        location / {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # API
        location /api {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # phpMyAdmin server on port 3305
    server {
        listen 3305;
        server_name localhost;

        location / {
            proxy_pass http://phpmyadmin:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
